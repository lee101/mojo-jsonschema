[project]
name = "mojo-jsonschema"
version = "0.1.0"
description = "JSON Schema validation with Mojo-accelerated record batches"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Lee Penkman", email = "leepenkman@gmail.com" }]
keywords = ["mojo", "json-schema", "validation"]

[project.optional-dependencies]
dev = ["pytest", "jsonschema"]

[project.scripts]
mojo-jsonschema = "mojojsonschema.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = { "" = "python" }

[tool.setuptools.packages.find]
where = ["python"]

